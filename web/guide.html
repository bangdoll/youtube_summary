<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學指南｜稜鏡流 PrismFlow</title>

    <!-- PWA / Home Screen Icon -->
    <link rel="icon" type="image/png" href="/static/icon.png?v=3">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Code Highlight -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Styles (Reuse main styles) -->
    <link rel="stylesheet" href="/static/styles.css?v=7.1.2">

    <style>
        /* Guide Specific Overrides */
        :root {
            --card-bg-rgb: 30, 30, 35;
            --accent-primary-rgb: 139, 92, 246;
        }

        [data-theme="light"] {
            --card-bg-rgb: 255, 255, 255;
            --accent-primary-rgb: 124, 58, 237;
        }

        body {
            overflow-y: auto;
            /* Allow full page scroll */
            background-attachment: fixed;
        }

        .guide-container {
            max-width: 900px;
            margin: 80px auto 40px;
            padding: 2rem;
            background: rgba(var(--card-bg-rgb), 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        .guide-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(var(--card-bg-rgb), 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            z-index: 100;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        .guide-content {
            margin-top: 1rem;
        }

        /* Markdown Styles Enhancement */
        .markdown-body h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .markdown-body h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
            margin-top: 2rem;
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--accent-primary);
            background: rgba(var(--accent-primary-rgb), 0.1);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: var(--accent-secondary);
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .error-msg {
            color: #ff4444;
            padding: 2rem;
            text-align: center;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid #ff4444;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <nav class="guide-nav">
        <a href="/" class="back-btn">
            <i class="ri-arrow-left-line"></i> 返回首頁
        </a>
    </nav>

    <div class="guide-container">
        <div id="content" class="markdown-body">
            <div class="loading">
                <i class="ri-loader-4-line ri-spin ri-2x"></i>
                <p>正在載入文檔...</p>
            </div>
        </div>
    </div>

    <!-- Script to Fetch and Render Markdown -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page');
            const contentDiv = document.getElementById('content');

            if (!page) {
                contentDiv.innerHTML = `
                    <div class="error-msg">
                        <h3><i class="ri-error-warning-line"></i> 未指定文檔</h3>
                        <p>請使用 ?page=filename.md 參數訪問</p>
                    </div>
                `;
                return;
            }

            try {
                // Fetch from new API endpoint
                const response = await fetch(`/api/docs/${encodeURIComponent(page)}`);

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const markdown = await response.text();

                // Configure marked
                marked.setOptions({
                    highlight: function (code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                // Render
                contentDiv.innerHTML = marked.parse(markdown);

                // Set Title
                const firstHeading = contentDiv.querySelector('h1');
                if (firstHeading) {
                    document.title = `${firstHeading.innerText}｜稜鏡流指南`;
                }

            } catch (error) {
                console.error('Failed to load doc:', error);
                contentDiv.innerHTML = `
                    <div class="error-msg">
                        <h3><i class="ri-file-close-line"></i> 載入失敗</h3>
                        <p>無法讀取文檔：${page}</p>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
